<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendrier de l’Avent</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--text:#2b2220;--muted:#7a6a63;--red:#b3262e;--green:#1f5d3e;--gold:#c9962b;--lock:#e9e0d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1413;--card:#2a201e;--text:#f3ebe4;--muted:#b3a399;--red:#e0555c;--green:#5fb98b;--gold:#e0b04e;--lock:#3a2e2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1413;--card:#2a201e;--text:#f3ebe4;--muted:#b3a399;--red:#e0555c;--green:#5fb98b;--gold:#e0b04e;--lock:#3a2e2b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 16px 40px}
h1{text-align:center;color:var(--red);font-size:clamp(1.6rem,6vw,2.4rem);margin:8px 0 4px}
.sub{text-align:center;color:var(--muted);margin:0 0 24px}
#teacher{display:none;background:var(--gold);color:#2b2220;text-align:center;border-radius:8px;padding:6px;margin-bottom:16px;font:600 .9rem system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.door{aspect-ratio:1;border:2px solid var(--gold);border-radius:12px;background:var(--red);color:#fff;font:700 1.6rem Georgia,serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s}
.door:hover{transform:translateY(-2px)}
.door small{font:.7rem system-ui,sans-serif;opacity:.85}
.door.open{background:var(--green)}
.door.locked{background:var(--lock);color:var(--muted);border-color:transparent}
.door.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#msg{text-align:center;min-height:1.5em;color:var(--red);font-family:system-ui,sans-serif;margin-top:16px}
dialog{border:3px solid var(--gold);border-radius:16px;background:var(--card);color:var(--text);max-width:440px;width:calc(100% - 32px);padding:24px;text-align:center}
dialog::backdrop{background:rgba(0,0,0,.55)}
.day{color:var(--red);font:700 1.6rem Georgia,serif;margin:0 0 8px}
.txt{color:var(--muted);font:1rem system-ui,sans-serif;margin:0 0 20px}
.btn{display:inline-block;font:600 1rem system-ui,sans-serif;padding:10px 18px;border-radius:8px;border:2px solid var(--green);background:var(--green);color:#fff;text-decoration:none;cursor:pointer;margin:4px}
.btn.o{background:transparent;color:var(--green)}
.btn.off{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<main>
<h1>🎄 Calendrier de l’Avent</h1>
<p class="sub">Chaque jour, une nouvelle porte s’ouvre ! · Każdego dnia otwierają się nowe drzwiczki.</p>
<div id="teacher">Tryb podglądu: wszystkie drzwiczki odblokowane</div>
<div class="grid" id="grid"></div>
<p id="msg" aria-live="polite"></p>
</main>

<dialog id="dlg">
<p class="day" id="dDay"></p>
<p class="txt" id="dTxt"></p>
<a class="btn" id="dLink" target="_blank" rel="noopener">Formularz · Przejdź do formularza →</a>
<button class="btn o" id="cBtn">Fermer</button>
</dialog>

<script>
// ===== DO EDYCJI: rok kalendarza i linki do 24 formularzy (kolejność = dni 1–24) =====
const YEAR = 2026;
const LINKS = [
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUMFcyQjAwUUNPM0dDS1pQVFQ0SDhMRjNIRi4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRURFlZRDg2REc1M00zUDFHTEFEUTdGNzBERC4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUQkVGU0FKRVJQRkdQNVlDWlhMMzBVMjVNOC4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUM1gxSUU4WUVLRUFFNERLQ0pRT0wwSzJTMy4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRURUdYSkdEN0M1T1BDMDdDV0dJM0I5MVhMRy4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUNE9COTc4SlY3RDFCRkhUWDlXNUJZRTBLUy4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRURFo5SEhLUVI3U1FZSjBQNVNMM0QyTExRNC4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRURTA4SlkzUUhaMldCQjA1TUlSTlVBWUJTMy4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRURVlEU0ExUE1YUUhNT1FUUjFTTDNLVjVGVC4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUMU5PWlBSMDRYTzA0T1NWV1ozV04yMTZZWC4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUQ0pZRk82SjNWMDNMRVVWRDZDRjk1Q0o1NS4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUQkEwVlQ5UUxFUUtBVkVKMVBaV04yTEJVOC4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUMVZXTTQwN0dSUU01VEpIQkNOQVkyMzBGUy4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUNEtINVFBRlZYQ0dESUFURlk2UzU5OUQ4VC4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUMTZMVUUyT1ZDR0ZCMjcxWE4zOTRSRUREWi4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUNTdZUDhFWjNaUkNUVkpRVVNCUDBWVFRRWC4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUM04xRk1YRzNaOENBS0JLQjY4TzRBNlZYRS4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUQ0xWTUtGVjBMQUhLSjk2Q0tERDBLUEgxQi4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUQTk5M0ZTRDc5RUw4Q0VTN0hQR1JTUE1JQS4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUMjlDUFdYOUdRNjNVMTNLV1NPVjRUQzJLTS4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUMk9FRjVSWFJUWFpSUUVIV1FMUDlSTlhESy4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUMFc4TEkxS0owWTVYTlAyWTlFTFRROFM5Mi4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRUQ1kxU1RFVENWSU42T0VGT0sxTjVGR01YSi4u",
 "https://forms.office.com/Pages/ResponsePage.aspx?id=wnq1f2cSi029g4qJgRbJDOU0Gksa9xNHsSKXfyEpCCRURFpBVEU4NDVKVU5ESlcxSURUWEhDVkVQQy4u"
];
// ===== koniec sekcji do edycji =====

const grid = document.getElementById("grid"), msg = document.getElementById("msg");
const dlg = document.getElementById("dlg"), dLink = document.getElementById("dLink");
const preview = () => location.hash === "#podglad-xmas26";
function isOpen(day){
  return preview() || new Date() >= new Date(YEAR, 11, day);
}
function render(){
  document.getElementById("teacher").style.display = preview() ? "block" : "none";
  grid.innerHTML = "";
  LINKS.forEach((_, i) => {
    const day = i + 1, open = isOpen(day);
    const b = document.createElement("button");
    b.className = "door " + (open ? "open" : "locked");
    b.innerHTML = day + "<small>" + (open ? "ouvert" : "🔒") + "</small>";
    b.setAttribute("aria-label", "Jour " + day);
    b.onclick = () => open ? show(i) : lock(b, day);
    grid.appendChild(b);
  });
}
function lock(el, day){
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  msg.textContent = "Pas encore ! Reviens le " + day + " décembre. · Jeszcze nie! Wróć " + day + " grudnia.";
}
function show(i){
  msg.textContent = "";
  document.getElementById("dDay").textContent = (i + 1) + " décembre";
  const url = LINKS[i];
  document.getElementById("dTxt").textContent = url
    ? "Zaloguj się kontem szkolnym i odpowiedz na dzisiejsze pytanie."
    : "Formularz na ten dzień będzie dostępny wkrótce.";
  dLink.classList.toggle("off", !url);
  if (url) dLink.href = url; else dLink.removeAttribute("href");
  dlg.showModal();
}
document.getElementById("cBtn").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
